<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>GYM BRUHS — Healthy Stuff</title>
<link rel="stylesheet" href="/styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="logo">💪</span><span><b>GYM BRUHS</b><small data-i18n="tagline">Healthy Stuff</small></span></a>
  <div class="actions">
    <button class="pill" id="langBtn" type="button" aria-label="Language">ES</button>
    <a class="pill" href="/staff" id="staffLink" style="text-decoration:none">Staff</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 data-i18n="heroTitle">Fuel up, bruh. 💪</h1>
    <p data-i18n="heroText"></p>
    <div class="loc">
      <label for="loc" class="hint" data-i18n="pickup">Pickup spot</label>
      <select id="loc" aria-label="Pickup spot"></select>
    </div>
  </section>

  <nav class="cats" id="cats" aria-label="Categories"></nav>
  <section class="grid" id="menu" aria-live="polite"></section>
  <footer><span data-i18n="poweredBy">Powered by</span> Maverick3 L.L.C.</footer>
</main>

<div class="cartbar" id="cartbar" hidden>
  <div class="inner">
    <div class="sum"><b id="cartTotal">$0.00</b><small id="cartCount"></small></div>
    <button class="btn" id="openCart" type="button" data-i18n="checkout">Checkout</button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <h2><span id="sheetTitle" data-i18n="cart">Your cart</span><button type="button" id="closeCart" aria-label="Close">×</button></h2>
    <div id="lines"></div>
    <div class="totals">
      <div><span data-i18n="subtotal">Subtotal</span><span id="subtotal"></span></div>
      <div id="taxRow"><span data-i18n="tax">Tax</span><span id="tax"></span></div>
      <div class="grand"><span data-i18n="total">Total</span><span id="total"></span></div>
    </div>
    <form class="form" id="checkoutForm" autocomplete="on">
      <label><span data-i18n="name">Name for pickup</span><input type="text" id="name" name="name" maxlength="60" required autocomplete="name"></label>
      <label><span data-i18n="phone">Phone (optional)</span><input type="tel" id="phone" name="phone" maxlength="32" autocomplete="tel"></label>
      <div class="hint" data-i18n="payHow">How do you want to pay?</div>
      <div class="pay" id="payOpts">
        <label id="payCard"><input type="radio" name="payment" value="card"><b data-i18n="card">Pay now</b><small data-i18n="cardSub"></small></label>
        <label id="payCounter" class="sel"><input type="radio" name="payment" value="counter" checked><b data-i18n="counter">Pay at counter</b><small data-i18n="counterSub"></small></label>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn block" id="placeBtn" type="submit" data-i18n="placeOrder">Place order</button>
    </form>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
